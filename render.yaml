services:
  # 1. Next.js 15 App Router Web Dashboard
  - type: web
    name: email-dispatcher-web
    env: docker
    dockerfilePath: ./infra/Dockerfile.web
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: email-dispatcher-api
          property: host

  # 2. Go REST API Gateway & Worker Engine
  - type: web
    name: email-dispatcher-api
    env: docker
    dockerfilePath: ./infra/Dockerfile.api
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: email-dispatcher-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: email-dispatcher-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: email-dispatcher-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: email-dispatcher-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: email-dispatcher-db
          property: database

databases:
  # 3. PostgreSQL Database
  - name: email-dispatcher-db
    databaseName: email_dispatcher
    plan: free
    region: oregon
