services:
  # 1. Next.js 15 App Router Web Dashboard
  - type: web
    name: email-dispatcher-web
    env: docker
    dockerfilePath: ./infra/Dockerfile.web
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: email-dispatcher-api
          property: host

  # 2. Go REST API Gateway
  - type: web
    name: email-dispatcher-api
    env: docker
    dockerfilePath: ./infra/Dockerfile.api
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: email-dispatcher-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: email-dispatcher-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: email-dispatcher-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: email-dispatcher-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: email-dispatcher-db
          property: database
      - key: REDIS_HOST
        fromService:
          type: redis
          name: email-dispatcher-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: email-dispatcher-redis
          property: port

  # 3. Go Asynq Worker Engine (Background Worker)
  - type: worker
    name: email-dispatcher-worker
    env: docker
    dockerfilePath: ./infra/Dockerfile.worker
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: email-dispatcher-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: email-dispatcher-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: email-dispatcher-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: email-dispatcher-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: email-dispatcher-db
          property: database
      - key: REDIS_HOST
        fromService:
          type: redis
          name: email-dispatcher-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: email-dispatcher-redis
          property: port

  # 4. Redis Key-Value Store
  - type: redis
    name: email-dispatcher-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  # 5. PostgreSQL Database
  - name: email-dispatcher-db
    databaseName: email_dispatcher
    plan: free
    region: oregon

